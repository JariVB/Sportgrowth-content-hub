<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Rj;src:url(../website/site/fonts/rajdhani-700.woff2)}
@font-face{font-family:In;src:url(../website/site/fonts/inter-var.woff2)}
@page{size:91mm 61mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff}
/* 91x61 mm = 85x55 mm + 3 mm afloop rondom. Tekst blijft 7 mm van de rand. */
.k{width:91mm;height:61mm;position:relative;overflow:hidden;page-break-after:always;font-family:In}
.v{background:#0d1b3e;color:#fff}
.glow{position:absolute;width:90mm;height:90mm;border-radius:50%;right:-35mm;top:-40mm;background:radial-gradient(circle,rgba(10,120,255,.45),rgba(10,120,255,0) 62%)}
.logo{position:absolute;left:10mm;top:13mm;width:17mm;height:17mm;border-radius:50%}
.wm{position:absolute;left:30.5mm;top:15.2mm;font:700 21pt/1 Rj;letter-spacing:.2px}
.wm i{display:block;font:600 6.6pt/1 In;font-style:normal;color:#00d4ff;letter-spacing:3.3pt;margin-top:1.2mm}
.tl{position:absolute;left:10mm;bottom:11mm;font:600 8pt/1.35 In;color:#c9d6ee}
.tl b{color:#00d4ff;font-weight:700}
.line{position:absolute;left:10mm;bottom:19.5mm;width:12mm;height:.7mm;background:#00d4ff;border-radius:1mm}
.a{background:#fff;color:#0d1b3e}
.a .bar{position:absolute;left:0;top:0;bottom:0;width:5mm;background:#0d1b3e}
.a .bar:after{content:"";position:absolute;right:0;top:0;bottom:0;width:1mm;background:#00d4ff}
.nm{position:absolute;left:12mm;top:10.5mm;font:700 15.5pt/1 Rj;text-transform:uppercase;letter-spacing:.3px}
.fn{position:absolute;left:12mm;top:17mm;font:600 7pt/1 In;color:#0a78ff;letter-spacing:1.2pt;text-transform:uppercase}
.ct{position:absolute;left:12mm;top:25mm;font:500 7.4pt/1.75 In;color:#24324f}
.ct span{display:inline-block;width:4.6mm;color:#0a78ff;font-weight:700}
.qr{position:absolute;right:9mm;top:12mm;width:22mm;height:22mm}
.qrt{position:absolute;right:7.5mm;top:35.5mm;width:25mm;text-align:center;font:700 6.6pt/1.25 In;color:#0d1b3e}
.qrt small{display:block;font:500 5.8pt In;color:#5b6a88}
</style></head><body>
<div class="k v"><div class="glow"></div><img class="logo" src="../instagram/beeldbank/logo-sgm-1080.png">
<div class="wm">SportGrowth<i>MEDIA</i></div><div class="line"></div>
<div class="tl">Instagram voor sportclubs en sportzaken.<br><b>Meer leden. Volle lessen.</b></div></div>
<div class="k a"><div class="bar"></div>
<div class="nm">Jari Van Boxlaer</div><div class="fn">Oprichter · padeltrainer</div>
<div class="ct"><span>T</span>0479 25 31 13<br><span>E</span>jari@sportgrowthmedia.be<br><span>W</span>sportgrowthmedia.be<br><span>IG</span>@sportgrowth_media</div>
<img class="qr" src="qr.svg"><div class="qrt">Gratis analyse<small>scan de code</small></div></div>
</body></html>
