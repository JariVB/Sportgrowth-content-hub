<title>Shotlist Sports NEXT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: één smalle kolom voor de gsm; sticky voortgangsbalk; per tijdsblok een lijst met grote afvinkrijen. Bewust één donkere SGM-look, leesbaar in een felle hal. */
:root{
  --bg:#0b1633; --card:#12224a; --line:#26386b; --fg:#eaf2ff; --muted:#9fb2d9;
  --cyan:#00d4ff; --done:#5fe0a0; --warn:#ffb86b;
  --flax:#d9b77a; --wall:#1b2d5c; --floor:#0f1d42; --grey:#3a4c80;
  --display:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:40px}
h2{font-size:24px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--cyan)}
header{padding-top:24px;display:flex;flex-direction:column;gap:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:6px 0 0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
a{color:var(--cyan)}

.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.prow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.prow span{color:var(--muted);font-weight:600;font-size:14px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--cyan);transition:width .3s}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.jump a{flex:none;text-decoration:none;font:600 13px var(--body);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.jump a.ok{border-color:var(--done);color:var(--done)}

section{display:flex;flex-direction:column;gap:10px;scroll-margin-top:110px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.time{font-family:var(--display);font-weight:700;color:var(--cyan);font-size:16px;white-space:nowrap}
.note{font-size:14px;color:var(--muted);margin:0}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px}
.item label{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 14px;cursor:pointer;align-items:start}
.item input{appearance:none;width:28px;height:28px;border:2px solid var(--muted);border-radius:8px;margin:0;display:grid;place-items:center;background:transparent;cursor:pointer}
.item input::after{content:"";width:12px;height:7px;border:3px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.item input:checked{background:var(--done);border-color:var(--done)}
.item input:checked::after{opacity:1}
.item input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.item.is-done{opacity:.55}
.item.is-done .t{text-decoration:line-through}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.t{font-weight:600}
.id{font-family:var(--display);font-weight:700;color:var(--cyan);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.gmline{font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.chip.zoom{color:var(--bg);background:var(--cyan);border-color:var(--cyan);font-weight:600}
.chip.mv{color:var(--cyan);border-color:var(--cyan)}
.chip.app{color:var(--bg);background:var(--fg);border-color:var(--fg);font-weight:600}
.chip.app.mimo{background:var(--warn);border-color:var(--warn)}
.tip{font-size:14px;color:var(--muted)}
.say{font-size:14px;background:var(--bg);border-left:3px solid var(--cyan);padding:6px 10px;border-radius:0 8px 8px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.say q{quotes:"“" "”"}
button{font:600 13px var(--body);color:var(--bg);background:var(--cyan);border:0;border-radius:99px;padding:5px 11px;cursor:pointer;flex:none}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.how{margin:0 14px 12px 54px;border-top:1px solid var(--line);padding-top:8px}
.how summary{cursor:pointer;font-family:var(--display);font-weight:700;color:var(--cyan);font-size:15px;letter-spacing:.04em}
.how dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.how dt{color:var(--muted);font-weight:600;white-space:nowrap}
.how dd{margin:0;min-width:0}
@media (max-width:420px){.how{margin-left:14px}.how dl{grid-template-columns:1fr;gap:0}.how dd{margin-bottom:6px}}
.item.is-done .how{display:none}
.box{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.box b{color:var(--warn)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.vis{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;align-items:stretch}
.vis figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.vis figcaption{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--display);font-weight:600}
.dia{background:var(--bg);border-radius:10px;width:100%;height:auto;display:block;flex:1}
.frame{aspect-ratio:9/16;max-width:100%;border-radius:12px;overflow:hidden;border:3px solid #000;background:var(--wall);box-shadow:0 0 0 1px var(--line)}
.frame svg{width:100%;height:100%;display:block}
/* schema-elementen */
.cone{fill:var(--cyan);opacity:.18}
.ph{fill:var(--fg)}
.subj{fill:var(--flax)}
.subj2{fill:var(--grey)}
.guide{fill:none;stroke:var(--cyan);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
.dlabel{fill:var(--muted);font:500 9px var(--body)}
.ground{stroke:var(--grey);stroke-width:2}
.pil{fill:#55669a}
/* beeld-elementen */
.wall{fill:var(--wall)} .floor{fill:var(--floor)} .fline{fill:#2c4280}
.oth{fill:var(--grey)} .banner{fill:var(--cyan)}
.bt{fill:#0d1b3e;font:700 26px var(--display);text-anchor:middle;letter-spacing:.08em}
.table{fill:#e6ecfa} .leg{fill:#9aa9cf}
.face{fill:var(--flax)} .inner{fill:#c79f5c} .hole{fill:#8a6a35}
.grip{fill:#14161c}
.pers{fill:#0d1b3e} .skin{fill:#e8c4a0}
.pillar rect{fill:#2a2f3d} .pillar .edge{fill:#4b5470}

/* animaties: 4,5 s, met stilstand aan begin en einde zoals je echt filmt */
svg *{transform-box:view-box}
.a{animation-duration:4.5s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.paused .a{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.a{animation-play-state:paused}}

@keyframes push{0%,12%{transform:translateY(0)}78%,100%{transform:translateY(-40px)}}
@keyframes pull{0%,12%{transform:translateY(0)}78%,100%{transform:translateY(40px)}}
@keyframes pan{0%,12%{transform:rotate(-38deg)}78%,100%{transform:rotate(38deg)}}
@keyframes tilt{0%,12%{transform:rotate(108deg)}78%,100%{transform:rotate(58deg)}}
@keyframes orbit{0%,12%{transform:rotate(60deg)}78%,100%{transform:rotate(-60deg)}}
@keyframes slide{0%,12%{transform:translateX(0)}78%,100%{transform:translateX(50px)}}
@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(120px)}}
@keyframes low{0%,12%{transform:translate(0,0) rotate(90deg)}78%,100%{transform:translate(0,52px) rotate(62deg)}}

@keyframes fpush{0%,12%{transform:scale(1)}78%,100%{transform:scale(1.9)}}
@keyframes fpull{0%,12%{transform:scale(1.9)}78%,100%{transform:scale(1)}}
@keyframes fpan{0%,12%{transform:translateX(120px)}78%,100%{transform:translateX(-120px)}}
@keyframes ftilt{0%,12%{transform:translateY(25px) scale(1.6)}78%,100%{transform:translateY(145px) scale(1.6)}}
@keyframes forbbg{0%,12%{transform:translateX(80px)}78%,100%{transform:translateX(-80px)}}
@keyframes forbrk{0%,12%{transform:scaleX(.4)}45%{transform:scaleX(1)}78%,100%{transform:scaleX(.4)}}
@keyframes freveal{0%,12%{transform:translateX(0)}78%,100%{transform:translateX(-230px)}}
@keyframes ftrack{0%{transform:translateX(0)}100%{transform:translateX(-200px)}}
@keyframes fbob{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-4px)}}
@keyframes flow{0%,12%{transform:translateY(0) scale(1)}78%,100%{transform:translateY(40px) scale(1.35)}}

.k-push{animation-name:push}.k-pull{animation-name:pull}.k-pan{animation-name:pan}.k-tilt{animation-name:tilt}
.k-orbit{animation-name:orbit}.k-slide{animation-name:slide}.k-low{animation-name:low}
.k-walk{animation-name:walk;animation-timing-function:linear;animation-duration:3.5s}
.f-push{animation-name:fpush;transform-origin:90px 145px}
.f-pull{animation-name:fpull;transform-origin:90px 145px}
.f-pan{animation-name:fpan}
.f-tilt{animation-name:ftilt;transform-origin:90px 160px}
.f-orbbg{animation-name:forbbg}
.f-orbrk{animation-name:forbrk;transform-origin:90px 150px}
.f-reveal{animation-name:freveal}
.f-track{animation-name:ftrack;animation-timing-function:linear;animation-duration:3.5s}
.f-bob{animation-name:fbob;animation-timing-function:linear;animation-duration:1.75s}
.f-low{animation-name:flow;transform-origin:90px 210px}
.how .vis{margin:8px 0 4px;max-width:340px;align-items:start}
.how .dia{flex:none}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SportGrowth Media · zondag 1 november</div>
    <h1>Shotlist Sports NEXT</h1>
    <dl class="facts">
      <dt>Waar</dt><dd>Nekkerhal, Plattebeekstraat 1, Mechelen</dd>
      <dt>Contact</dt><dd>Koen (Flaxx Rackets), aan de stand behalve 15u30-16u15</dd>
      <dt>Bewegingen</dt><dd><a href="https://claude.ai/artifact/BWCAvP153KpGWFRvS6RT6y" target="_blank" rel="noopener">Filmgids met animaties</a></dd>

  </header>

  <div class="progress" aria-live="polite">
    <div class="prow">Klaar <span id="count">0 / 0</span></div>

    <nav class="jump" id="jump"></nav>
  </div>

  <div id="list" class="wrap" style="gap:28px"></div>

  <div class="foot">
    <span id="saved">Je vinkjes worden op deze gsm bewaard.</span>
    <button class="ghost" id="reset" type="button">Alles leegmaken</button>
  </div>
</div>

const S = [
 {id:"dag", nav:"Dagplan", h:"Dagplan zondag", time:"12u45-17u",
  note:"Wat je filmt, wanneer je post en wie je tagt. De details per shot staan in de blokken eronder.",
  items:[
   {id:"P1", t:"Vóór vertrek", tip:"Gsm, powerbank, microfoon en gimbal opgeladen. Camera op 1080p, HDR uit. Niet storen aan. Lens schoon."},
   {id:"P2", t:"12u45 · Aankomst: film A1 + A2, post meteen story 1", copy:"Vandaag op Sports NEXT 🏟️", tip:"Story 1 = A2 (jij die binnenstapt). Locatiesticker: Nekkerhal Mechelen. Tag het officiële account van Sports NEXT (zoek via @ en kies het account met het vinkje of de meeste volgers)."},
   {id:"P3", t:"12u50 · In de hal: film A3 + A4, post story 2", copy:"De toekomst van sport, op één plek", tip:"Story 2 = A3 (pan over de hal) of A4 (een demo). Geen tag nodig."},
   {id:"P4", t:"13u00 · Stand Flaxx: Koen begroeten, bedanken, 2 min afstemmen (B0)", tip:"Vraag ook of je vandaag al een story met tag mag posten."},
   {id:"P5", t:"13u05 · Film B1 tot B8 (stand, reveal, orbit, vlas, handen, Koen, test)", tip:"Na B1: story 3 posten, als Koen akkoord gaf."},
   {id:"P6", t:"Story 3 · de stand van Flaxx", copy:"De lancering van de ERGO CONTROL en ERGO POWER 🇧🇪", tip:"Beeld B1. Tag @flaxx_rackets. Productnamen in hoofdletters, zoals Flaxx ze schrijft."},
   {id:"P7", t:"13u30 · Interview Koen in een rustige hoek (B9, 4 vragen) + B-roll + B10 + foto B11", tip:"Microfoon op Koen én op jou. Luister vraag 1 terug met je oortjes."},
   {id:"P8", t:"14u00 · Sessie (optioneel) of rustig moment: A5 Motionlapse + blok E", tip:"Sessie: niet filmen, wel notities. Motionlapse doe je best als het druk is in de hal."},
   {id:"P9", t:"15u30 · Panel 'Padel: From Hype to Habit': luisteren + notities (D1-D4)", tip:"Niet filmen. Hooguit 1 foto van ver, als dat mag. Die foto is story 4."},
   {id:"P10", t:"16u15 · Na het panel: kort voorstellen aan Tom De Sutter (D5), post story 4", copy:"Interessant gesprek over padel: van hype naar gewoonte. Morgen deel ik wat ik leerde 👀", tip:"Tag @flaxx_rackets (Koen zat in het panel). Tag de andere sprekers niet, tenzij je hun account zeker kent."},
   {id:"P11", t:"16u30 · Bij Koen: bedanken, testrackets, collab do 5/11 afspreken (blok F)", tip:"Wil hij meer weten over een samenwerking: F3 tot F6. Niet ter plaatse verkopen."},
   {id:"P12", t:"Zondagavond · Niets op je feed posten", tip:"Alleen stories vandaag. Deelt Flaxx of Sports NEXT jouw story, deel die dan opnieuw in je eigen story. Beantwoord berichten en reacties."},
   {id:"P13", t:"Zondagavond · Beelden en notities naar Claude (15 min)", tip:"Mislukte takes weggooien. Stuur het interview, blok B en E en je notities van het panel. Clips langer dan 25 s eerst knippen."},
   {id:"P14", t:"Maandag · Lanceringsvideo naar Koen + carrousel 19u30", tip:"Claude maakt overdag de lanceringsvideo (15-20 s) voor Flaxx en de carrousel 'Padel: van hype naar gewoonte'. 's Avonds stuur jij de video naar Koen en plan je de carrousel in."}
  ]},
 {id:"voor", nav:"Voorbereiding", h:"Voorbereiding", time:"za-avond",
  note:"Op je iPhone: Instellingen → Camera.",
  items:[
   {id:"v1", t:"Video op 1080p HD · 30 fps", tip:"Instellingen → Camera → Video opnemen. Instagram toont maximaal 1080p. Zo blijft een clip van 25 s onder 30 MB en kan je hem rechtstreeks naar Claude sturen. Laat Formaten op 'Hoge efficiency' staan."},
   {id:"v2", t:"HDR-video uit", tip:"HDR geeft vreemde kleuren in CapCut en op Instagram."},
   {id:"v3", t:"Raster aan"},

   {id:"v6b", t:"Pootjes van de gimbal: zoek vooraf een hoge tafel of toog", tip:"De pootjes staan laag. Voor het interview moet de gsm op ooghoogte van Koen: zet de gimbal op de toog van de stand, een statafel of een kist. Lukt dat niet: je begeleider houdt de gimbal vast."},
   {id:"v6c", t:"Oortjes om het geluid te controleren"},
   {id:"v6d", t:"Gimbal opgeladen + DJI Mimo op 1080p · 30 fps", tip:"Zaterdag testen: open handpalm naar de camera, kader wordt groen, loop een paar keer door je kamer."},
   {id:"v6f", t:"Motionlapse en slow motion testen in DJI Mimo", tip:"Tik op het icoontje van de opnamestanden naast de opnameknop. Motionlapse: punt A en B kiezen, kijk hoe lang je moet filmen voor 5 s. Slow motion: zwaai met een racket en kijk het terug."},
   {id:"v6e", t:"Optioneel: ledlampje met clip", tip:"Voor het gezicht van Koen als het hallicht van boven komt."},

 {id:"gimbal", box:true, h:"Gimbal en DJI Mimo: zo stel je in",
  lines:["Bij elk shot staat een regel met 🎛️: gimbal of niet, welke stand in DJI Mimo, volgen aan of uit en wat je omkadert.","DJI Mimo · Video: 1080p · 30 fps. Gimbalstand: Follow (de standaard).","Volgen AAN: trek met je vinger een kader rond het onderwerp tot het groen wordt. Jezelf: steek je open handpalm naar de camera.","Volgen UIT: tik op het kader of het kruisje om te stoppen. Bij de Camera-app volgt de gimbal nooit, hij houdt het beeld alleen stabiel.","Beeld scheef of weggedraaid: druk 2 keer op de trekker om te centreren (kijk in DJI Mimo hoe het bij jouw model werkt).","Microfoon: steek de ontvanger in de gsm vóór je de app opent. Bovenaan in de app verschijnt een microfoonicoon."]},
 {id:"zoom", box:true, h:"Welke zoom? Kijk naar het blauwe label 🔍",
  lines:["Tik onderaan in de camera op 0,5x, 1x of 2x. Nooit met twee vingers verder inzoomen: dan wordt het beeld korrelig.","0,5x · breed: de hal, de gevel, een pan. Niet voor gezichten van dichtbij, want 0,5x vervormt aan de randen.","1x · standaard: de beste kwaliteit. Voor het interview, de rackets, orbit, push-in en jij in beeld.","2x · van verder weg: Koen in gesprek (B7). Je hoeft niet dichtbij te komen en de achtergrond lijkt dichterbij.","Macro (B5): op 1x dicht bij het racket. Je iPhone schakelt zelf naar macro (bloempje)."]},

 {id:"a", nav:"A · aankomst", h:"A · Aankomst", time:"±12u45",

   {id:"A2", gm:"Gimbal in de hand · Mimo Video · volgen AAN: kader rond jezelf (open handpalm) · selfiecamera", z:"selfie · uitgezoomd", app:"DJI Mimo · volgen aan", t:"Jij die binnenstapt (selfie-video)", c:["half","5 s","story 1"], mv:"meelopen"},
   {id:"A3", gm:"Geen gimbal · uit de hand", z:"0,5x", app:"iPhone Camera", t:"De hal met volk en standen", c:["breed","8 s","story 2"], mv:"pan", tip:"Voeten stil, draai vanuit je heupen van links naar rechts."},
   {id:"A4", gm:"Geen gimbal · uit de hand", z:"1x", app:"iPhone Camera", t:"Een demo of iets wat beweegt", c:["half","5 s","story 2"], mv:"statisch"},

 {id:"b", nav:"B · Flaxx", h:"B · Stand Flaxx", time:"±13u",
  note:"Eerst Koen begroeten en bedanken voor de tickets. Dan 2 minuten afstemmen (B0). Daarna filmen.",
  items:[
   {id:"B0a", t:"Afstemmen: wat maken we?", say:"Ik maak vandaag 2 dingen: een korte video van de lancering die jullie zelf mogen posten, en beelden voor onze collab-reel van volgende donderdag, waarin we de rackets testen op mijn training. Klopt dat voor jou?"},

const MOVE = Object.fromEntries(moves.map(m=>[m.n.toLowerCase(), m]));
const MVMAP = {"push-in":"push-in","pan":"pan","orbit":"orbit","reveal":"reveal","meelopen":"meelopen","lage hoek":"lage hoek","push-in / orbit":"push-in","motionlapse":"pan"};
const raster = `<g stroke="#ffffff" stroke-opacity=".35" stroke-width="1"><line x1="60" y1="0" x2="60" y2="320"/><line x1="120" y1="0" x2="120" y2="320"/><line x1="0" y1="106.7" x2="180" y2="106.7"/><line x1="0" y1="213.3" x2="180" y2="213.3"/></g>`;
const sdia = (label, dist, y=34, extra="") => dia(`${subj(100,y,label)}<line class="guide" x1="128" y1="${y+14}" x2="128" y2="104" style="stroke-dasharray:2 3"/><text class="dlabel" x="134" y="${(y+118)/2}">${dist}</text>${extra}<g transform="translate(100,118)">${phone}</g><text class="dlabel" x="100" y="138" text-anchor="middle">gsm stil</text>`);
const big = (cx, hy, s=1, col="pers") => `<g transform="translate(${cx},${hy}) scale(${s})"><circle class="skin" cx="0" cy="0" r="26"/><rect x="-46" y="32" width="92" height="220" rx="40" fill="#4b5e96"/></g>`;
const mic = (cx,y) => `<rect x="${cx-4}" y="${y}" width="8" height="12" rx="2" fill="#111"/><circle cx="${cx}" cy="${y-2}" r="3" fill="#00d4ff"/>`;
const STATIC = {
 A1:{d: sdia("ingang","5-10 m",30),
     f: frame(`<rect x="0" y="0" width="180" height="320" fill="#24386e"/><rect x="10" y="40" width="160" height="230" fill="#3a4c80"/><rect x="25" y="55" width="130" height="40" rx="4" class="banner"/><text class="bt" x="90" y="83" style="font-size:20px">SPORTS NEXT</text><rect x="65" y="170" width="50" height="100" fill="#0d1b3e"/><rect x="0" y="270" width="180" height="50" class="floor"/>${[30,60,140].map(x=>`<circle class="skin" cx="${x}" cy="262" r="5"/><rect class="pers" x="${x-6}" y="268" width="12" height="26" rx="5"/>`).join("")}${raster}`)},
 A4:{d: sdia("demo","1-2 m"),
     f: frame(`${bg}<rect x="30" y="95" width="120" height="80" rx="6" fill="#0d1b3e" stroke="#00d4ff" stroke-width="3"/><polygon points="80,118 80,152 108,135" fill="#00d4ff"/><rect x="40" y="175" width="100" height="40" fill="#9aa9cf"/>${raster}`)},
 B5:{d: sdia("racketblad","10-15 cm",40),
     f: frame(`<rect x="0" y="0" width="180" height="320" fill="#c79f5c"/><g stroke="#8a6a35" stroke-opacity=".55" stroke-width="2">${Array.from({length:30},(_,i)=>`<line x1="${-200+i*14}" y1="0" x2="${i*14}" y2="320"/>`).join("")}</g><g stroke="#e6c88e" stroke-opacity=".45" stroke-width="2">${Array.from({length:30},(_,i)=>`<line x1="${i*14}" y1="0" x2="${-200+i*14}" y2="320"/>`).join("")}</g><circle cx="50" cy="90" r="16" fill="#5a4220"/><circle cx="130" cy="230" r="16" fill="#5a4220"/><rect x="70" y="140" width="40" height="40" fill="none" stroke="#ffd60a" stroke-width="2"/><text x="90" y="196" text-anchor="middle" style="fill:#ffd60a;font:600 8px var(--body)">tik hier</text>`)},
 B6:{d: sdia("racket op tafel","50 cm",34),
     f: frame(`<rect x="0" y="0" width="180" height="320" fill="#e6ecfa"/><g transform="rotate(-25 90 170)"><ellipse cx="90" cy="130" rx="40" ry="50" class="face"/><ellipse cx="90" cy="130" rx="32" ry="42" class="inner"/><rect x="83" y="178" width="14" height="70" rx="5" class="grip"/></g><ellipse cx="125" cy="245" rx="26" ry="18" class="skin"/><rect x="128" y="250" width="60" height="30" rx="12" class="skin"/>`)},
 B7:{d: dia(`${subj(100,30,"Koen")}<circle class="subj2" cx="112" cy="70" r="10"/><text class="dlabel" x="140" y="72">bezoeker</text><g transform="translate(130,118) rotate(-15)">${phone}</g><text class="dlabel" x="100" y="138" text-anchor="middle">schuin achter de bezoeker, 2-3 m</text>`),
     f: frame(`${bg}${big(110,120,.55)}<g opacity=".92"><circle cx="30" cy="190" r="48" fill="#141a2a"/><rect x="-40" y="225" width="150" height="120" rx="50" fill="#141a2a"/></g>${raster}`)},
 B9a:{d: dia(`${subj(100,30,"Koen")}<text class="dlabel" x="40" y="22" text-anchor="middle">licht</text><circle cx="40" cy="34" r="7" fill="#ffd60a"/><line class="guide" x1="128" y1="44" x2="128" y2="104" style="stroke-dasharray:2 3"/><text class="dlabel" x="134" y="78">1-1,5 m</text><g transform="translate(100,118)">${phone}</g><text class="dlabel" x="100" y="138" text-anchor="middle">statief op ooghoogte</text>`),
     f: frame(`${bg}${big(122,100)}${mic(122,160)}${raster}<text x="4" y="103" style="fill:#fff;font:600 8px var(--body)">ogen op deze lijn</text>`)},
 B10:{d: sdia("jij","1 m"),
     f: frame(`${bg}${big(100,100)}<g transform="translate(-35,-35) scale(.8)">${racket}</g>${mic(100,160)}${raster}`)},
 B11:{d: sdia("jij + Koen","2 m"),

 E1:{d: sdia("jij","1 m"),
     f: frame(`<g style="filter:blur(1.5px)">${bgTrack}</g>${big(90,100)}${mic(90,160)}${raster}`)}

STATIC.B9b = STATIC.B9a; STATIC.B9c = STATIC.B9a; STATIC.B9e = STATIC.B9a;
const visHtml = (id, mv) => { const st = STATIC[id]; if (st) return `<div class="vis"><figure>${st.d}<figcaption>Zo sta je</figcaption></figure><figure>${st.f}<figcaption>Zo ziet je beeld eruit</figcaption></figure></div>`; const m = MOVE[MVMAP[mv]]; if (!m) return ""; return `<div class="vis"><figure>${m.d}<figcaption>Zo beweeg je</figcaption></figure><figure>${m.f}<figcaption>Dit zie je</figcaption></figure></div>`; };
const LBL = {waar:"Waar sta je", start:"Begin", doe:"Wat doe je", einde:"Einde", let:"Let op"};
const howHtml = (id, mv) => { const h = HOW[id]; if (!h) return ""; return `<details class="how" open><summary>Zo film je</summary>${visHtml(id, mv)}<dl>${Object.keys(LBL).filter(k=>h[k]).map(k=>`<dt>${LBL[k]}</dt><dd>${esc(h[k])}</dd>`).join("")}</dl></details>`; };
const list = document.getElementById("list");
list.innerHTML = S.map(s => s.box ? `
  <div class="box"><b>${esc(s.h)}</b>${s.lines.map(l=>`<div>· ${esc(l)}</div>`).join("")}</div>` : `
  <section id="${s.id}">
    <div class="shead"><h2>${esc(s.h)}</h2><span class="time">${esc(s.time)}</span></div>
    ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
    <ul class="items">${s.items.map(i => `
      <li class="item" data-id="${i.id}">
        <label>
          <input type="checkbox" id="cb-${i.id}" ${state[i.id] ? "checked" : ""}>
          <div class="body">
            <div class="t">${/^[A-F]\d/.test(i.id) ? `<span class="id">${i.id.replace(/[a-d]$/,"")}</span>` : ""}${esc(i.t)}</div>
            ${(i.c||i.mv||i.app||i.z) ? `<div class="chips">${i.z ? `<span class="chip zoom">🔍 ${esc(i.z)}</span>` : ""}${i.app ? `<span class="chip app${/Mimo/.test(i.app)?" mimo":""}">${esc(i.app)}</span>` : ""}${i.mv ? `<span class="chip mv">${esc(i.mv)}</span>` : ""}${(i.c||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}
            ${i.gm ? `<div class="gmline">🎛️ ${esc(i.gm)}</div>` : ""}
            ${i.say ? `<div class="say"><q>${esc(i.say)}</q></div>` : ""}
            ${i.copy ? `<div class="say"><span>${esc(i.copy)}</span><button type="button" data-copy="${esc(i.copy)}">Kopieer</button></div>` : ""}
            ${i.tip ? `<div class="tip">${esc(i.tip)}</div>` : ""}
          </div>
        </label>
        ${howHtml(i.id, i.mv)}
      </li>`).join("")}
    </ul>
  </section>`).join("");

const secs = S.filter(s => !s.box);
const jump = document.getElementById("jump");
jump.innerHTML = secs.map(s => `<a href="#${s.id}" data-s="${s.id}">${esc(s.nav)}</a>`).join("");

function update(){
  const all = secs.flatMap(s => s.items.map(i => i.id));
  const done = all.filter(id => state[id]).length;
  document.getElementById("count").textContent = `${done} / ${all.length}`;
  document.getElementById("fill").style.width = (done / all.length * 100) + "%";
  secs.forEach(s => jump.querySelector(`[data-s="${s.id}"]`).classList.toggle("ok", s.items.every(i => state[i.id])));
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("is-done", !!state[el.dataset.id]));
}
list.addEventListener("change", e => {
  const li = e.target.closest(".item"); if (!li) return;
  state[li.dataset.id] = e.target.checked; save(); update();
});
list.addEventListener("click", e => {
  const b = e.target.closest("button[data-copy]"); if (!b) return;
  e.preventDefault();
  const txt = b.dataset.copy;
  const ok = () => { b.textContent = "Gekopieerd"; setTimeout(() => b.textContent = "Kopieer", 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Geselecteerd"; };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch(err) { fallback(); }
});
const reset = document.getElementById("reset");
let armed = false;
reset.addEventListener("click", () => {
  if (!armed) { armed = true; reset.textContent = "Tik nog eens om alles leeg te maken"; setTimeout(() => { armed = false; reset.textContent = "Alles leegmaken"; }, 3000); return; }
  state = {}; save(); document.querySelectorAll(".item input").forEach(i => i.checked = false); update();
  armed = false; reset.textContent = "Alles leegmaken";
});
update();
</script>
